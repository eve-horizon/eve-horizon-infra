apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-registry
  namespace: eve
  labels:
    app.kubernetes.io/name: eve-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-registry
    spec:
      serviceAccountName: eve-registry
      containers:
        - name: registry
          # distribution v3: the API signs registry tokens with an RFC 7638
          # JWK-thumbprint key ID, which v3 matches against rootcertbundle.
          # registry:2 keys its trusted certs by libtrust fingerprint and
          # rejects every token the API issues.
          image: distribution/distribution:3.1.2@sha256:d106962e6fe3fa69c178cec77eeeee5edb626b8df6535b7bd6b95e658a0a5ca9
          imagePullPolicy: IfNotPresent
          # Name the config explicitly. A registry that misses its config falls
          # back to the image's built-in one and serves with no auth at all.
          # scripts/validate-template.sh and `eve-infra deploy` both check this.
          args: ["serve", "/etc/distribution/config.yml"]
          ports:
            - name: registry
              containerPort: 5000
          volumeMounts:
            - name: config
              mountPath: /etc/distribution
            - name: signing-cert
              mountPath: /etc/registry/signing-cert.pem
              subPath: cert.pem
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: eve-registry-config
            items:
              - key: config.yml
                path: config.yml
        - name: signing-cert
          secret:
            secretName: eve-registry-cert
