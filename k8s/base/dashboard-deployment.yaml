apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-dashboard
  namespace: eve
  labels:
    app.kubernetes.io/name: eve-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-dashboard
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          securityContext:
            allowPrivilegeEscalation: false
          image: eve-horizon/dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3200
          env:
            - name: EVE_API_URL
              value: http://eve-api:4701
            - name: PORT
              value: "3200"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
