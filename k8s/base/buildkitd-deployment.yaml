apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: eve
  labels:
    app.kubernetes.io/name: buildkitd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
    spec:
      containers:
        - name: buildkitd
          # v0.34.1 by digest (multi-arch index). v0.12.5 bundled a runc
          # without the 2025 container-escape fixes.
          image: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-gc
            # GC limits in MB: Reserved,MinFree,MaxUsed. Sized for the 20Gi
            # buildkitd-cache volume; an overlay that resizes the volume must
            # keep MinFree + MaxUsed below it (template CI checks each render).
            - --oci-worker-gc-keepstorage=2000,3000,15000
          ports:
            - name: grpc
              containerPort: 1234
          securityContext:
            privileged: true
          volumeMounts:
            - name: buildkitd-cache
              mountPath: /var/lib/buildkit
      volumes:
        - name: buildkitd-cache
          persistentVolumeClaim:
            claimName: buildkitd-cache
