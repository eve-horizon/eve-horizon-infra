apiVersion: v1
kind: ServiceAccount
metadata:
  name: eve-worker
  namespace: eve
---
# Runner pods and their workspace claims in the eve namespace (kubectl apply,
# get and delete from the worker; list and delete from the runner reaper).
# No pods/exec: nothing in the worker execs into pods, and exec in this
# namespace would reach the privileged BuildKit pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eve-worker
  namespace: eve
rules:
  - apiGroups: [""]
    resources:
      - pods
      - persistentvolumeclaims
      - services
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
---
# App environments. The worker creates and deletes environment namespaces and
# applies Deployments, Services, Ingresses, ConfigMaps, Secrets, PVCs and Jobs
# in them. It never watches, never lists Secrets, and never creates
# DaemonSets, StatefulSets, ReplicaSets or CronJobs, so those are not granted.
# Admission guards (overlays/gcp/admission-policies.yaml) refuse privileged
# or host-level pods, writes in system namespaces, and any write in eve other
# than runner pods and their claims. They cannot refuse reads: this identity
# still reads Secrets in eve until job code leaves the worker pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eve-worker
rules:
  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
  - apiGroups: [""]
    resources:
      - pods
      - persistentvolumeclaims
      - services
      - configmaps
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - create
      - delete
      - patch
      - update
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eve-worker
  namespace: eve
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eve-worker
subjects:
  - kind: ServiceAccount
    name: eve-worker
    namespace: eve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eve-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eve-worker
subjects:
  - kind: ServiceAccount
    name: eve-worker
    namespace: eve
