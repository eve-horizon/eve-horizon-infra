# Identity for runner pods (EVE_RUNNER_SERVICE_ACCOUNT on the worker).
#
# Runner pods execute job code. The worker reaches them over their pod IP and
# they talk only to the Eve API, so they need no Kubernetes API access: this
# account has no RBAC bindings, no cloud identity annotations and no mounted
# token. Do not bind roles to it or add Workload Identity / IRSA annotations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eve-runner
  namespace: eve
  labels:
    app.kubernetes.io/name: eve-runner
automountServiceAccountToken: false
