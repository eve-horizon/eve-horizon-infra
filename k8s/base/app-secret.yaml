apiVersion: v1
kind: Secret
metadata:
  name: eve-app
  namespace: eve
type: Opaque
# Placeholder only. Every overlay deletes it: `eve-infra secrets sync` writes
# eve-app (and the API-only eve-api-keys) from config/secrets.env.
stringData:
  EVE_INTERNAL_API_KEY: ""
  EVE_SLACK_SIGNING_SECRET: ""
  EVE_SLACK_CLIENT_ID: ""
  EVE_SLACK_CLIENT_SECRET: ""
  # Claude Code OAuth token for API authentication
  CLAUDE_CODE_OAUTH_TOKEN: ""
  # GHCR (GitHub Container Registry) credentials
  GHCR_USERNAME: ""
  GHCR_TOKEN: ""
  # GitHub token for PR creation
  GITHUB_TOKEN: ""
