apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eve-api
  namespace: eve
  annotations:
    kubernetes.io/ingress.class: nginx
    # This Ingress owns the API host's certificate; eve-gateway shares it.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.eve.example.com
      secretName: eve-api-tls
  rules:
    - $patch: replace
      host: api.eve.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eve-api
                port:
                  number: 4701
