apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - admission-policies.yaml
  - network-policies.yaml
  - ../../base
  - storage-workload-identity.yaml
  - registry-pvc.yaml
# Org filesystem (/org, claim eve-org-fs-org-default). Keep exactly one profile;
# cost and trade-offs are in each component and in CLAUDE.md, Cost Management.
# A running instance cannot switch by editing this line alone: the claim's
# storage class is immutable (see org-fs/disk/kustomization.yaml).
components:
  - org-fs/filestore   # Filestore RWX, 100 GiB: agent runtimes on any number of nodes
  # - org-fs/disk      # small: 10 GiB RWO disk, agent runtimes share one node
namespace: eve
patches:
  # Workload Identity annotations for eve-api and eve-worker KSAs (defined in base)
  - target:
      kind: ServiceAccount
      name: eve-api
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: INSTANCE_PREFIX-eve-storage@GCP_PROJECT.iam.gserviceaccount.com
  - target:
      kind: ServiceAccount
      name: eve-worker
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: INSTANCE_PREFIX-eve-storage@GCP_PROJECT.iam.gserviceaccount.com
  - target:
      kind: ServiceAccount
      name: eve-orchestrator
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: INSTANCE_PREFIX-eve-storage@GCP_PROJECT.iam.gserviceaccount.com
  - path: api-ingress-patch.yaml
  - path: api-deployment-patch.yaml
  - path: agent-runtime-deployment-patch.yaml
  - path: buildkit-patch.yaml
  - path: gateway-ingress-patch.yaml
  - path: gateway-deployment-patch.yaml
  - path: orchestrator-deployment-patch.yaml
  - path: worker-deployment-patch.yaml
  - path: dashboard-deployment-patch.yaml
  - path: sso-ingress-patch.yaml
  - path: sso-deployment-patch.yaml
  - path: supabase-auth-ingress-patch.yaml
  - path: supabase-auth-deployment-patch.yaml
  # Eve-native registry for images built by Eve (build and deploy flow)
  - path: registry-configmap-patch.yaml
  - path: registry-deployment-patch.yaml
  - path: registry-ingress-patch.yaml
  # Delete db-migrate-job from kustomize build — it's a one-shot job
  # applied separately by the deploy workflow's migration step.
  - target:
      kind: Job
      name: eve-db-migrate
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: eve-db-migrate
  # Remove eve-app secret from kustomize — managed by setup.sh from secrets.env
  - target:
      kind: Secret
      name: eve-app
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: eve-app
  # Remove in-cluster postgres (using Cloud SQL instead)
  - target:
      kind: StatefulSet
      name: postgres
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
  - target:
      kind: Service
      name: postgres
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  - target:
      kind: Secret
      name: eve-postgres
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: eve-postgres
