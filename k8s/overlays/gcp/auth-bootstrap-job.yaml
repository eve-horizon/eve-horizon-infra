apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-bootstrap
  namespace: eve
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-db-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: postgres:16-alpine
          command: ["sh", "/scripts/bootstrap-auth-role.sh"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: DATABASE_URL
            - name: AUTH_ROLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_AUTH_ADMIN_PASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: auth-bootstrap-scripts
            defaultMode: 0755
