apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eve-gateway
  namespace: eve
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  # Same host as eve-api, so the same certificate. No issuer annotation here:
  # eve-api's owns the Certificate, and a second owner would conflict.
  tls:
    - hosts:
        - api.eve.example.com
      secretName: eve-api-tls
  rules:
    - $patch: replace
      host: api.eve.example.com
      http:
        paths:
          - path: /integrations/slack
            pathType: Prefix
            backend:
              service:
                name: eve-gateway
                port:
                  number: 4820
          - path: /gateway/providers
            pathType: Prefix
            backend:
              service:
                name: eve-gateway
                port:
                  number: 4820
