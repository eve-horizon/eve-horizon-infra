apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eve-dashboard
  namespace: eve
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - dashboard.eve.example.com
      secretName: eve-dashboard-tls
  rules:
    - $patch: replace
      host: dashboard.eve.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eve-dashboard
                port:
                  number: 3200
