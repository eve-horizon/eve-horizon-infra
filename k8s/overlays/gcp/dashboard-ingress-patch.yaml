# Serve the dashboard through ingress-nginx at dashboard.<domain>, like the
# API. With no class, GKE's built-in controller claimed this Ingress (setup.sh
# does not make ingress-nginx the default class) and built a separate Google
# load balancer outside the platform DNS. Rules have no merge key, so this
# list replaces the base rule.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eve-dashboard
  namespace: eve
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: dashboard.eve.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eve-dashboard
                port:
                  number: 3200
