# Workload Identity — KSA for agent-runtime to act as the storage GSA.
# This lets pods authenticate to GCS natively via Application Default Credentials.
# The eve-api / eve-worker / eve-orchestrator KSAs are defined in base and get the
# same annotation via strategic patches in kustomization.yaml; eve-agent-runtime has
# no base ServiceAccount, so it is created here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eve-agent-runtime
  namespace: eve
  annotations:
    iam.gke.io/gcp-service-account: INSTANCE_PREFIX-eve-storage@GCP_PROJECT.iam.gserviceaccount.com
