apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eve-agent-runtime
  namespace: eve
spec:
  replicas: 1
  template:
    spec:
      serviceAccountName: eve-worker
      containers:
        - name: agent-runtime
          image: ghcr.io/eve-horizon/eve-horizon/agent-runtime:0.1.332
          imagePullPolicy: Always
          env:
            - $patch: replace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eve-demo-db
                  key: DATABASE_URL
            - name: EVE_API_URL
              value: http://eve-api:4701
            - name: AGENT_RUNTIME_PORT
              value: "4812"
            - name: EVE_ORG_ID
              value: org_manualtestorg
            - name: AGENT_RUNTIME_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AGENT_RUNTIME_CAPACITY
              value: "8"
            - name: AGENT_RUNTIME_STATUS
              value: healthy
            - name: EVE_ORG_FS_ROOT
              value: /org
            - name: EVE_K8S_NAMESPACE
              value: eve
            - name: EVE_RUNTIME
              value: k8s
            - name: WORKSPACE_ROOT
              value: /opt/eve/workspaces
            - name: EVE_RUNNER_IMAGE
              value: "ghcr.io/eve-horizon/eve-horizon/worker:0.1.332"
            - name: EVE_TOOLCHAIN_IMAGE_PREFIX
              value: "ghcr.io/eve-horizon/eve-horizon/toolchain-"
            - name: EVE_TOOLCHAIN_IMAGE_TAG
              value: "0.1.0"
