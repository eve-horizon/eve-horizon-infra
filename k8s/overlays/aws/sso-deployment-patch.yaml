apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-sso
  namespace: eve
spec:
  template:
    spec:
      containers:
        - name: sso
          image: ghcr.io/eve-horizon/eve-horizon/sso:0.1.332
          env:
            - name: SUPABASE_AUTH_EXTERNAL_URL
              value: "https://auth.example.com"
            - name: EVE_DEFAULT_DOMAIN
              value: "example.com"
            - name: EVE_SSO_SECURE_COOKIES
              value: "true"
