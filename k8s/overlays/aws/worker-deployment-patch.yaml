apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-worker
  namespace: eve
spec:
  template:
    spec:
      containers:
        - name: worker
          image: public.ecr.aws/w7c4v0w3/eve-horizon/worker:0.1.132
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          env:
            - $patch: replace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eve-staging-db
                  key: DATABASE_URL
            - name: EVE_RUNTIME
              value: k8s
            - name: EVE_K8S_NAMESPACE
              value: eve
            - name: EVE_BUILDKIT_ADDR
              value: tcp://buildkitd.eve.svc:1234
            - name: EVE_RUNNER_IMAGE
              value: "public.ecr.aws/w7c4v0w3/eve-horizon/worker:0.1.132"
            - name: EVE_TOOLCHAIN_IMAGE_PREFIX
              value: "public.ecr.aws/w7c4v0w3/eve-horizon/toolchain-"
            - name: EVE_TOOLCHAIN_IMAGE_TAG
              value: "latest"
            - name: EVE_RUNNER_SERVICE_ACCOUNT
              value: eve-worker
            - name: EVE_API_URL
              value: http://eve-api:4701
            - name: EVE_PUBLIC_API_URL
              value: "https://api.eve.example.com"
            - name: WORKER_PORT
              value: "4749"
            - name: EVE_DEFAULT_DOMAIN
              value: "apps.example.com"
            - name: EVE_MANAGED_DB_ENABLED_PRELOAD_EXTENSIONS
              value: "pg_cron"
            - name: EVE_COMPUTE_MODEL
              value: "eks"
            - name: EVE_DEFAULT_INGRESS_CLASS
              value: "nginx"
            - name: EVE_APP_NODE_SELECTOR_KEY
              value: role
            - name: EVE_APP_NODE_SELECTOR_VALUE
              value: apps
            - name: EVE_APP_TAINT_KEY
              value: role
            - name: EVE_APP_TAINT_VALUE
              value: apps
            - name: EVE_APP_TAINT_EFFECT
              value: NoSchedule
            - name: EVE_DEFAULT_TLS_CLUSTER_ISSUER
              value: "letsencrypt-prod"
            - name: EVE_REGISTRY_HOST
              value: "registry.eve.example.com"
            - name: EVE_PLATFORM_INGRESS_HOSTNAME
              value: "ingress.eve.example.com"
            - name: EVE_PLATFORM_INGRESS_IP
              value: "REPLACE_INGRESS_IP"
            - name: EVE_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_API_KEY
