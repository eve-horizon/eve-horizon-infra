name: Bug report
description: Report a problem with the public infrastructure template
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must be reported privately via SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and the expected result.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options: [AWS k3s, AWS EKS, GCP GKE, Terraform, operator CLI, CI]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and validation output
      description: Include commands and redacted output; never include credentials or instance secrets.
    validations:
      required: true
